<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fake News Detector{% endblock %}</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'detector/css/style.css' %}">
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <nav class="glass-nav">
            <div class="nav-brand">
                <a href="{% url 'home' %}">
                    <span class="brand-icon">🛡️</span>
                    <span class="brand-text">TruthGuard</span>
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="{% url 'home' %}">Analyze</a></li>
                <li><a href="{% url 'history' %}">History</a></li>
                <li><a href="{% url 'about' %}">About</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            {% if messages %}
                <div class="messages-container">
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            {% block content %}
            {% endblock %}
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 TruthGuard Fake News Detection. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
